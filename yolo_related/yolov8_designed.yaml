# yolov8n-p2.yaml   ← 实际文件名是你项目中的 yolov8_designed.yaml
nc: 1                 # 类别数
scales:
  n: [0.33, 0.25, 1024]

# ==================== Backbone ====================
backbone:
  # ---------- 改进1：用 SPDConv 替换标准 Conv ----------
  - [-1, 1, SPDConv, [64]]         # 0-P1/2   [SPDConv] 无损下采样，保留小目标细节
  - [-1, 1, SPDConv, [128]]        # 1-P2/4   [SPDConv]
  # ----------------------------------------------------
  - [-1, 3, C2f, [128, True]]      # 2         ← 这是后续 P2 检测头要融合的特征层
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

# ==================== Head ====================
head:
  # 第一次上采样 (P5 → P4)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11
  # ---------- 改进2：将普通 C2f 替换为带注意力的 C2fAttn ----------
  - [-1, 3, C2fAttn, [512, 128, 1]]                # 12   [C2fAttn] 通道+空间注意力，抑制杂波
  # --------------------------------------------------------------

  # 第二次上采样 (P4 → P3)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 3, C2fAttn, [256, 128, 1]]                # 15   [C2fAttn]

  # ---------- 改进3：新增 P2 极小目标检测分支 ----------
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 16  ↑ 从 P3 再往上采样一次
  - [[-1, 2], 1, Concat, [1]]                     # 17  ← 融合 backbone 第2层 (P2/4 特征)
  - [-1, 3, C2f, [128]]                           # 18  ← P2 特征层 (4× 下采样)
  # ----------------------------------------------------

  # PAN 自底向上（将 P2 的信息也向下传递）
  - [-1, 1, Conv, [128, 3, 2]]                    # 19
  - [[-1, 15], 1, Concat, [1]]                    # 20
  - [-1, 3, C2f, [256]]                           # 21 (P3)

  - [-1, 1, Conv, [256, 3, 2]]                    # 22
  - [[-1, 12], 1, Concat, [1]]                    # 23
  - [-1, 3, C2f, [512]]                           # 24 (P4)

  - [-1, 1, Conv, [512, 3, 2]]                    # 25
  - [[-1, 9], 1, Concat, [1]]                     # 26
  - [-1, 3, C2f, [1024]]                          # 27 (P5)

  # ---------- 改进4：检测头包含 P2 层 ----------
  # 标准 YOLOv8 只有 [P3, P4, P5] 三个尺度，这里增加了 P2 (第18层)
  - [[18, 21, 24, 27], 1, Detect, [nc]]           # 28  ← 四个检测尺度 [P2, P3, P4, P5]
  # -----------------------------------------------