# yolov8_p2_only.yaml
# 在标准YOLOv8n基础上增加P2检测头（不修改Backbone）
# 用于消融实验：单独验证P2的效果
nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # 标准 YOLOv8n backbone（无 SPDConv）
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 3, C2f, [128, True]]           # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 6, C2f, [256, True]]           # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 6, C2f, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 3, C2f, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9

head:
  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11
  - [-1, 3, C2f, [512]]                           # 12

  # P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 3, C2f, [256]]                           # 15

  # P3 → P2
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 16
  - [[-1, 2], 1, Concat, [1]]                     # 17
  - [-1, 3, C2f, [128]]                           # 18 (P2)

  # PAN: P2 → P3
  - [-1, 1, Conv, [128, 3, 2]]                    # 19
  - [[-1, 15], 1, Concat, [1]]                    # 20
  - [-1, 3, C2f, [256]]                           # 21 (P3)

  # PAN: P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]                    # 22
  - [[-1, 12], 1, Concat, [1]]                    # 23
  - [-1, 3, C2f, [512]]                           # 24 (P4)

  # PAN: P4 → P5
  - [-1, 1, Conv, [512, 3, 2]]                    # 25
  - [[-1, 9], 1, Concat, [1]]                     # 26
  - [-1, 3, C2f, [1024]]                          # 27 (P5)

  # 四尺度检测头 [P2, P3, P4, P5]
  - [[18, 21, 24, 27], 1, Detect, [nc]]           # 28
