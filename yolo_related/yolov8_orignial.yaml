# yolov8n.yaml (原始，未作任何修改)
nc: 1                     # 原始80类，你的任务需改为1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2   ← 标准 Conv
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4   ← 标准 Conv
  - [-1, 3, C2f, [128, True]]           # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 6, C2f, [256, True]]           # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 6, C2f, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 3, C2f, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11
  - [-1, 3, C2f, [512]]                           # 12   ← 普通 C2f

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 3, C2f, [256]]                           # 15   ← 普通 C2f

  # 原始到此为止，只有 P3 层，没有继续上采样到 P2

  - [-1, 1, Conv, [256, 3, 2]]                    # 16
  - [[-1, 12], 1, Concat, [1]]                    # 17
  - [-1, 3, C2f, [512]]                           # 18 (P4)

  - [-1, 1, Conv, [512, 3, 2]]                    # 19
  - [[-1, 9], 1, Concat, [1]]                     # 20
  - [-1, 3, C2f, [1024]]                          # 21 (P5)

  # 检测头只有三个尺度 [P3, P4, P5]
  - [[15, 18, 21], 1, Detect, [nc]]               # 22